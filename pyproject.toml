[project]
name = "fundexporter"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "apscheduler>=3.11.3",
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "lxml>=6.1.1",
    "prometheus-client>=0.25.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
# 外部服務（gist/IMAP/http）的防護邏輯刻意 catch-all，log 後繼續
ignore = ["BLE001"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
